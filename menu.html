<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>邻里话养生 · 方库速查</title>
<style>
  :root{ --bg:#f6f7f4; --card:#ffffff; --ink:#1f2a24; --sub:#5b6b62; --line:#e4e9e4; --accent:#2f7d5b; --warn:#9a5b3b; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
  header{ position:sticky; top:0; z-index:10; background:var(--accent); color:#fff;
    padding:14px 16px calc(14px + env(safe-area-inset-top)) 16px; padding-top:calc(14px + env(safe-area-inset-top)); }
  header h1{ margin:0; font-size:17px; font-weight:700; letter-spacing:.5px; }
  header p{ margin:4px 0 0; font-size:12px; opacity:.85; }
  .wrap{ max-width:680px; margin:0 auto; padding:12px; }
  .search{ position:sticky; top:0; z-index:9; background:var(--bg); padding:10px 0 8px; }
  .search input{ width:100%; border:1px solid var(--line); border-radius:12px; padding:13px 16px;
    font-size:16px; background:var(--card); color:var(--ink); outline:none; }
  .search input:focus{ border-color:var(--accent); }
  .status{ font-size:12px; color:var(--sub); padding:4px 2px 10px; min-height:18px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px;
    box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .card h2{ margin:0 0 8px; font-size:16px; color:var(--accent); line-height:1.4; }
  .row{ font-size:14px; line-height:1.7; margin:6px 0; }
  .row .k{ color:var(--sub); font-weight:600; margin-right:6px; }
  .row .v{ white-space:pre-wrap; word-break:break-word; }
  .risk{ font-size:12px; color:var(--warn); background:#fbf2ec; border-radius:8px; padding:8px 10px; margin-top:10px; line-height:1.6; }
  .empty{ text-align:center; color:var(--sub); padding:40px 16px; font-size:14px; }
  .hint{ font-size:12px; color:var(--sub); text-align:center; padding:6px 0 24px; }
  footer{ text-align:center; font-size:11px; color:#9aa6a0; padding:8px 0 calc(20px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<header>
  <h1>邻里话养生 · 方库速查</h1>
  <p>输入症状或药材名，查民间方（共 32740 条）</p>
</header>
<div class="wrap">
  <div class="search">
    <input id="q" type="search" inputmode="search" placeholder="如：咳嗽、黄芪、失眠、跌打损伤" autocomplete="off">
  </div>
  <div class="status" id="status">数据加载中…</div>
  <div id="results"></div>
  <div class="hint" id="hint"></div>
  <footer>内容仅供文化参考，不构成医疗建议</footer>
</div>
<script>
const STATUS = document.getElementById('status');
const RESULTS = document.getElementById('results');
const HINT = document.getElementById('hint');
const INPUT = document.getElementById('q');
let ENTRIES = [];
let READY = false;

function norm(s){ return (s||'').toLowerCase().replace(/\s+/g,''); }

async function decompress(buf){
  try{
    const ds = new Response(buf).body.pipeThrough(new DecompressionStream('gzip'));
    const text = await new Response(ds).text();
    return JSON.parse(text);
  }catch(e){
    // 兜底：若服务端已自动解压
    try{ return JSON.parse(new TextDecoder().decode(buf)); }catch(_){ throw e; }
  }
}

async function loadAll(){
  const t0 = performance.now();
  const man = await (await fetch('menu_data/manifest.json', {cache:'no-cache'})).json();
  const urls = man.chunks.map(c => 'menu_data/' + c);
  const bufs = await Promise.all(urls.map(u => fetch(u, {cache:'no-cache'}).then(r => r.arrayBuffer())));
  const lists = await Promise.all(bufs.map(decompress));
  ENTRIES = [].concat(...lists);
  READY = true;
  STATUS.textContent = '已加载 ' + ENTRIES.length.toLocaleString() + ' 条 · 输入关键词查询';
  const dt = ((performance.now()-t0)/1000).toFixed(1);
  HINT.textContent = '数据 ' + dt + 's 加载完成（首次稍慢，之后走缓存）';
}

INPUT.addEventListener('input', () => render());
INPUT.addEventListener('keydown', e => { if(e.key==='Enter'){ INPUT.blur(); render(); } });

function render(){
  const kw = norm(INPUT.value.trim());
  if(!READY){ STATUS.textContent = '数据加载中，请稍候…'; return; }
  if(!kw){ RESULTS.innerHTML = ''; STATUS.textContent = '已加载 ' + ENTRIES.length.toLocaleString() + ' 条 · 输入关键词查询'; HINT.textContent=''; return; }
  const hits = [];
  for(let i=0;i<ENTRIES.length;i++){
    const e = ENTRIES[i];
    const hay = norm(e[1] + ' ' + e[2] + ' ' + e[3] + ' ' + e[4]);
    if(hay.includes(kw)) hits.push(e);
    if(hits.length >= 200) break;
  }
  STATUS.textContent = '匹配 ' + hits.length + ' 条' + (hits.length>50?'（显示前 50）':'');
  if(!hits.length){
    RESULTS.innerHTML = '<div class="empty">没找到相关方。<br>试试更通用的词，如「咳嗽」「失眠」「黄芪」。</div>';
    HINT.textContent=''; return;
  }
  const top = hits.slice(0,50);
  RESULTS.innerHTML = top.map(e => card(e)).join('');
  HINT.textContent = hits.length>50 ? ('仅显示前 50 条，输入更精准的词可缩小范围') : '';
}

function card(e){
  const id=e[0], title=e[1], symptom=e[2], treatment=e[3], source=e[4], risk=e[5]||'';
  return `<div class="card">
    <h2>${esc(title||'(无名方)')}</h2>
    <div class="row"><span class="k">适用症</span><span class="v">${esc(symptom)}</span></div>
    <div class="row"><span class="k">治疗方法</span><span class="v">${esc(treatment)}</span></div>
    <div class="row"><span class="k">来源</span><span class="v">${esc(source)}</span></div>
    ${risk?`<div class="risk">⚠ 风险提示：${esc(risk)}</div>`:''}
  </div>`;
}
function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

loadAll().catch(err => {
  STATUS.textContent = '数据加载失败：' + err.message;
  HINT.textContent = '请检查网络后刷新页面（需能访问 github.io）';
});
</script>
</body>
</html>
